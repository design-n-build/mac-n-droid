<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GitHub preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* GitHub social preview: 1280 × 640. Same palette and type as the Play screenshots. */
  :root { --cream: #f5f1ec; --ink: #222a25; --soft: #e3dcd5; --muted: #5d655f; --green: #0da457; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--cream); }
  body { font-family: "Inter Tight", system-ui, sans-serif; color: var(--ink); position: relative; }

  .blob { position: absolute; right: -120px; top: -90px; width: 760px; height: 820px; border-radius: 48% 52% 44% 56% / 52% 46% 54% 48%;
          background: var(--soft); }

  .copy { position: absolute; left: 80px; top: 92px; width: 500px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; border-radius: 15px; }
  .brand span { font-size: 30px; font-weight: 600; letter-spacing: -0.2px; }
  h1 { margin-top: 44px; font-size: 58px; line-height: 1.06; font-weight: 600; letter-spacing: -1.4px; }
  p { margin-top: 22px; max-width: 450px; font-size: 23px; line-height: 1.4; color: var(--muted); font-weight: 500; }
  .chips { margin-top: 34px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { padding: 9px 16px; border-radius: 999px; background: #fff; font-size: 17px; font-weight: 600;
          box-shadow: 0 1px 0 rgba(0,0,0,.04); }
  .chip.green { background: var(--ink); color: var(--cream); }

  .mac { position: absolute; left: 706px; top: 104px; width: 540px; border-radius: 14px; overflow: hidden;
         box-shadow: 0 30px 70px rgba(34,42,37,.22), 0 0 0 1px rgba(0,0,0,.06); }
  .mac img { display: block; width: 100%; }

  .phone { position: absolute; left: 628px; top: 208px; width: 182px; border-radius: 22px; background: #1c201e;
           padding: 7px; box-shadow: 0 30px 60px rgba(34,42,37,.32); }
  /* The screen is exactly the app's shape (no empty space), under an Android status bar. */
  .phone .screen { position: relative; border-radius: 16px; overflow: hidden; background: #eaefe8; padding-bottom: 9px; }
  .phone .handle { position: absolute; left: 50%; bottom: 5px; width: 54px; height: 3px; margin-left: -27px; border-radius: 2px; background: #171d19; }
  .phone .status { height: 20px; padding: 0 12px 0 14px; display: flex; align-items: center; justify-content: space-between;
                   font-family: Roboto, "Inter Tight", system-ui, sans-serif; font-size: 9.5px; font-weight: 500; color: #171d19; }
  .phone .status .icons { display: flex; align-items: center; gap: 4px; }
  .phone img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="blob"></div>

  <div class="copy">
    <div class="brand"><img src="../play-icon.png" alt=""><span>Mac n Droid</span></div>
    <h1>Your Android phone and your Mac, together.</h1>
    <p>Notifications, texts, files, clipboard and music. Free, open source, no account.</p>
    <div class="chips">
      <div class="chip green">macOS</div>
      <div class="chip green">Android</div>
      <div class="chip">Windows &amp; Linux (beta)</div>
    </div>
  </div>

  <div class="mac"><img src="../../screens/mac/mac-01-overview.png" alt=""></div>
  <div class="phone"><div class="screen">
    <div class="status"><span>12:30</span><span class="icons">
      <svg width="11" height="9" viewBox="0 0 24 18" fill="#171d19"><path d="M12 17.5 0.6 6.1A16.6 16.6 0 0 1 12 1.5c4.3 0 8.3 1.7 11.4 4.6z"/></svg>
      <svg width="9" height="9" viewBox="0 0 24 24" fill="#171d19"><path d="M2 22h20V2z"/></svg>
      <svg width="13" height="8" viewBox="0 0 26 14" fill="none"><rect x="0.75" y="0.75" width="21.5" height="12.5" rx="3.5" stroke="#171d19" stroke-width="1.5"/><rect x="3" y="3" width="14" height="8" rx="1.5" fill="#171d19"/><rect x="23.5" y="4.5" width="2" height="5" rx="1" fill="#171d19"/></svg>
    </span></div>
    <img src="../../screens/android/android-01-home.png" alt="">
    <div class="handle"></div>
  </div></div>
</body>
</html>
