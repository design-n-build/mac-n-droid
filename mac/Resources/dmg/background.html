<!doctype html>
<!-- The background of the DMG window (660 × 440). Rendered to background.tiff by scripts/render-dmg-background.mjs.
     Icons are SF Symbols from scripts/render-dmg-symbols.swift. Finder places the real icons on top:
     the app at (170, 172), Applications at (490, 172) (see settings.py).
     Vertical rhythm: 22px between groups, 12px inside a group. -->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:660px;height:440px;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;color:#1d1d1f;background:#fbfbfd;position:relative}
  .abs{position:absolute}
  h1{top:22px;left:0;right:0;margin:0;text-align:center;font-size:21px;line-height:26px;font-weight:650;letter-spacing:-.02em}
  h1 span{color:#0DA457}
  .sub{top:52px;left:0;right:0;text-align:center;font-size:12.5px;line-height:16px;color:#6e6e73}

  /* Tiles behind the two Finder icons: icon centre (170|490, 172), label centre y ≈ 254 */
  .tile{top:90px;width:172px;height:190px;border-radius:30px;box-sizing:border-box}
  .tile.app{left:84px;background:#fff;border:1px solid rgba(0,0,0,.06);box-shadow:0 8px 24px rgba(0,0,0,.05)}
  .tile.dest{left:404px;border:1.5px dashed #c7c7cc}

  /* Drag arrow: one stroke, one colour, from the dashes to the head */
  .drag{top:160px;left:276px}

  /* Phone ↔ Mac, with what travels between them */
  .phone{top:302px;left:192px;height:52px}
  .mac{top:306px;left:408px;height:44px}
  .line{top:327px;left:240px;width:160px;border-top:1.5px solid #d2d2d7}
  .chip{top:314px;width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid #e5e5ea;
        display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  /* optically matched: the photo is wide, the clipboard tall */
  .chip img{height:14px}
  .chip img.wide{height:12.5px}
  .chip img.tall{height:15px}
  .cap{top:366px;left:0;right:0;text-align:center;font-size:12px;line-height:15px;color:#6e6e73}

  .foot{top:403px;left:0;right:0;text-align:center;font-size:11px;line-height:14px;color:#86868b}
  .foot b{color:#515154;font-weight:600}
</style></head><body>
<h1 class="abs">Drag <span>Mac n Droid</span> to Applications</h1>
<div class="abs sub">Your Android phone and your Mac, together.</div>

<div class="abs tile app"></div>
<div class="abs tile dest"></div>
<svg class="abs drag" width="108" height="24" viewBox="0 0 108 24" fill="none" stroke="#aeaeb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M2 12 H98" stroke-dasharray="5 6"/><path d="M92 5 L100 12 L92 19"/>
</svg>

<img class="abs phone" src="symbols/smartphone.png">
<div class="abs line"></div>
<div class="abs chip" style="left:262px"><img src="symbols/bell.fill.png"></div>
<div class="abs chip" style="left:306px"><img class="wide" src="symbols/photo.fill.png"></div>
<div class="abs chip" style="left:350px"><img class="tall" src="symbols/list.clipboard.fill.png"></div>
<img class="abs mac" src="symbols/laptopcomputer.png">
<div class="abs cap">Then open it and pair your phone.</div>

<div class="abs foot">First time? If macOS won't open it: <b>System Settings → Privacy &amp; Security → Open Anyway</b></div>
</body></html>
