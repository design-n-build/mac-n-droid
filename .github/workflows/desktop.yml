# Builds Mac n Droid for Windows and Linux and tests both end to end with a fake phone (tools/fake_phone.py).
# Runs on every release tag (v1.2.3), and from the Actions tab (Run workflow). On a tag, the installers are added
# to that GitHub release; otherwise they appear under the run's "Artifacts".
name: Windows and Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Add the installers to this existing release (e.g. v0.14.2). Leave empty to only build."
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  protocol-test:
    name: End-to-end test (both apps, with a fake phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Install GTK, GStreamer and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-glib-2.0 gir1.2-gtk-4.0 gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav ffmpeg > /dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc=size=540x1200:rate=30 -t 2 -c:v libx264 -pix_fmt yuv420p \
            -profile:v baseline -x264-params keyint=30:aud=1 -f h264 $RUNNER_TEMP/clip.h264
      - name: Linux app
        run: |
          export MACNDROID_CONFIG=$RUNNER_TEMP/lx MACNDROID_PORT=47900 MACNDROID_DOWNLOADS=$RUNNER_TEMP/lx/dl MIRROR_VIDEO=1
          mkdir -p $MACNDROID_DOWNLOADS
          python3 linux/tests/e2e.py &
          APP=$!
          # Wait until the app has written its identity and is listening (up to 60 s), not a fixed time: CI machines vary.
          for i in $(seq 120); do [ -f $MACNDROID_CONFIG/identity.json ] && ss -ltn | grep -q ":$MACNDROID_PORT " && break; sleep 0.5; done
          python3 tools/fake_phone.py --identity $MACNDROID_CONFIG/identity.json --port 47900 --video $RUNNER_TEMP/clip.h264 \
            --seconds 10 --expect clip_history,sms_threads,sms_thread,contacts_search,sms_send,mirror_start,media_cmd,notif_action,open_url,file_ok,folder_ok,mac_media
          wait $APP
      - name: Windows app core
        run: |
          export MACNDROID_CONFIG=$RUNNER_TEMP/win MACNDROID_PORT=47901 MACNDROID_DOWNLOADS=$RUNNER_TEMP/win/dl MIRROR_VIDEO=1
          dotnet build windows/CoreTest -c Release -v q
          dotnet run --no-build -c Release --project windows/CoreTest -- 9 &
          APP=$!
          # Wait until the app has written its identity and is listening (up to 60 s), not a fixed time: CI machines vary.
          for i in $(seq 120); do [ -f $MACNDROID_CONFIG/identity.json ] && ss -ltn | grep -q ":$MACNDROID_PORT " && break; sleep 0.5; done
          python3 tools/fake_phone.py --identity $MACNDROID_CONFIG/identity.json --port 47901 --video $RUNNER_TEMP/clip.h264 \
            --seconds 10 --expect clip_history,sms_threads,sms_thread,contacts_search,sms_send,mirror_start,media_cmd,notif_action,open_url,file_ok,folder_ok,mac_media,play_on_phone_ok
          wait $APP
      - name: Windows app core with a 0.14.5 phone (resume after a dropped connection, free space)
        run: |
          export MACNDROID_CONFIG=$RUNNER_TEMP/win2 MACNDROID_PORT=47904 MACNDROID_DOWNLOADS=$RUNNER_TEMP/win2/dl PHONE_V0145=1
          dotnet run --no-build -c Release --project windows/CoreTest -- 12 &
          APP=$!
          for i in $(seq 120); do [ -f $MACNDROID_CONFIG/identity.json ] && ss -ltn | grep -q ":$MACNDROID_PORT " && break; sleep 0.5; done
          python3 tools/fake_phone.py --v0145 --identity $MACNDROID_CONFIG/identity.json --port 47904 --seconds 12 \
            --expect clip_history,sms_threads,media_cmd,notif_action,open_url,file_ok,folder_ok,mac_media,file_refuse,resume_ok,play_on_phone_ok
          wait $APP
      - name: Linux screenshots (every page, paired with the fake phone)
        continue-on-error: true   # pictures for checking layout; never blocks a release
        run: |
          # The app's CI screenshot mode (linux/macndroid/shots.py) opens each page at two window sizes and quits.
          sudo apt-get install -y -qq gir1.2-adw-1 xvfb python3-qrcode > /dev/null
          export MACNDROID_CONFIG=$RUNNER_TEMP/lxs MACNDROID_PORT=47903 MACNDROID_DOWNLOADS=$RUNNER_TEMP/lxs/dl
          export MACNDROID_BRIDGE_PORT=47839 MACNDROID_SHOTS=$PWD/linux-shots GSK_RENDERER=cairo
          mkdir -p $MACNDROID_DOWNLOADS
          (cd linux && timeout 240 dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m macndroid) &
          APP=$!
          for i in $(seq 120); do [ -f $MACNDROID_CONFIG/identity.json ] && ss -ltn | grep -q ":$MACNDROID_PORT " && break; sleep 0.5; done
          timeout 200 python3 tools/fake_phone.py --identity $MACNDROID_CONFIG/identity.json --port 47903 --seconds 150 > phone.log 2>&1 &
          wait $APP || true
          tail -5 phone.log; ls -l linux-shots || true
          ls linux-shots/*.png > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          path: linux-shots/
          if-no-files-found: ignore

  windows:
    name: Windows (${{ matrix.arch }})
    needs: protocol-test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        shell: pwsh
        run: |
          # Windows App SDK 1.6's packaging tasks ship with the .NET 8 SDK, not the newer one on the runner.
          $sdk = (dotnet --list-sdks | Select-String '^8\.' | Select-Object -Last 1).ToString().Split(' ')[0]
          dotnet new globaljson --sdk-version $sdk --force
          $platform = if ("${{ matrix.arch }}" -eq "arm64") { "ARM64" } else { "x64" }
          # Visual Studio's MSBuild has the resource (PRI) packaging tasks that the dotnet CLI lacks.
          msbuild windows/App/MacNDroid.csproj /restore /t:Publish /v:minimal /p:Configuration=Release `
            /p:Platform=$platform /p:RuntimeIdentifier=win-${{ matrix.arch }} `
            "/p:PublishDir=$((Resolve-Path .).Path)\publish\${{ matrix.arch }}\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Opens without crashing
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          # The protocol test above never opens the window; a missing UI file only shows up when the app starts.
          Get-ChildItem -Recurse -Filter *.pri windows/App/bin, windows/App/obj, publish/x64 -ErrorAction SilentlyContinue |
            ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName }
          if (-not (Test-Path publish/x64/resources.pri)) { Write-Error "resources.pri is missing from the build"; exit 1 }
          $env:MACNDROID_TRACE = "1"
          $p = Start-Process publish/x64/MacNDroid.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-2)} |
              Where-Object { $_.Message -match 'MacNDroid' } | Format-List TimeCreated, ProviderName, Message
            Get-Content "$env:APPDATA\Mac n Droid\crash.log" -ErrorAction SilentlyContinue
            Write-Error "Mac n Droid quit on launch (exit code $($p.ExitCode))"; exit 1
          }
          Stop-Process -Id $p.Id -Force
      - name: Screenshots (every page, paired with the fake phone)
        if: matrix.arch == 'x64'
        continue-on-error: true   # pictures for checking layout; never blocks a release
        shell: pwsh
        run: |
          # The app's CI screenshot mode (windows/App/Screenshots.cs) opens each page at two window sizes and quits.
          # The runner's screen is 1024 × 768, smaller than the window; make it 1920 × 1080 so both sizes fit.
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class Display {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields, dmPositionX, dmPositionY,
              dmDisplayOrientation, dmDisplayFixedOutput; public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency,
              dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] static extern bool EnumDisplaySettings(string d, int mode, ref DEVMODE dm);
            [DllImport("user32.dll")] static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            public static int Set(int w, int h) {
              var dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              EnumDisplaySettings(null, -1, ref dm); dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref dm, 0);
            }
          }
          "@
          "Screen 1920 x 1080: result $([Display]::Set(1920, 1080)) (0 = done)"
          $cfg = "$env:RUNNER_TEMP\shots-cfg"; New-Item -ItemType Directory -Force $cfg, "$cfg\dl" | Out-Null
          $env:MACNDROID_CONFIG = $cfg; $env:MACNDROID_PORT = "47902"; $env:MACNDROID_DOWNLOADS = "$cfg\dl"
          $env:MACNDROID_BRIDGE_PORT = "47829"; $env:MACNDROID_SHOTS = "$PWD\shots"
          $app = Start-Process publish/x64/MacNDroid.exe -PassThru
          for ($i = 0; $i -lt 120 -and -not (Test-Path "$cfg\identity.json"); $i++) { Start-Sleep -Milliseconds 500 }
          # The fake phone uses OpenSSL through ctypes; Git for Windows ships it.
          $dll = Get-ChildItem "C:\Program Files\Git\mingw64\bin\libcrypto-*.dll", "C:\Program Files\OpenSSL*\bin\libcrypto-*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          $env:MACNDROID_LIBCRYPTO = $dll.FullName; $env:PYTHONUTF8 = "1"   # its log has arrows the Windows console can't print
          $phone = Start-Process python -ArgumentList "tools/fake_phone.py", "--identity", "$cfg\identity.json", "--port", "47902", "--seconds", "150" `
            -PassThru -NoNewWindow -RedirectStandardOutput phone.log -RedirectStandardError phone.err
          if (-not $app.WaitForExit(200000)) { Stop-Process -Id $app.Id -Force }
          Stop-Process -Id $phone.Id -Force -ErrorAction SilentlyContinue
          Get-Content phone.log, phone.err -ErrorAction SilentlyContinue | Select-Object -Last 20
          Get-Content "$env:APPDATA\Mac n Droid\crash.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          Get-ChildItem shots -ErrorAction SilentlyContinue | Format-Table Name, Length
          if (-not (Get-ChildItem shots -Filter *.png -ErrorAction SilentlyContinue)) { Write-Error "No screenshots were saved"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x64'
        with:
          name: windows-screenshots
          if-no-files-found: ignore
          path: shots/
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = ([xml](Get-Content windows/App/MacNDroid.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          New-Item -ItemType Directory -Force release | Out-Null
          & $iscc /DVersion=$version /DArch=${{ matrix.arch }} "/DSource=..\publish\${{ matrix.arch }}" windows/installer.iss
          Compress-Archive -Path publish/${{ matrix.arch }}/* -DestinationPath release/MacNDroid-$version-Windows-${{ matrix.arch }}-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: release/*

  linux:
    name: Linux (${{ matrix.arch }} Flatpak)
    needs: protocol-test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: MacNDroid-Linux-${{ matrix.arch }}.flatpak
          manifest-path: linux/app.macndroid.Linux.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ github.sha }}
      - name: Name it with the version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' linux/macndroid/__init__.py)
          mkdir -p release && mv MacNDroid-Linux-${{ matrix.arch }}.flatpak "release/MacNDroid-$VERSION-Linux-${{ matrix.arch }}.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release/*.flatpak

  extension:
    name: Browser extension (Chrome, Edge, Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and check
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('browser-extension/manifest.json'))['version'])")
          tools/package-extension.sh "$VERSION"
          mkdir ffx && cd ffx && unzip -q ../release/MacNDroid-extension-firefox-$VERSION.zip && npx -y web-ext@8 lint --warnings-as-errors
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: release/*.zip

  # Every installer, added to the GitHub release in one place (on a tag, or with the "tag" input).
  publish:
    name: Add to the release
    needs: [windows, linux, extension]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Upload
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ inputs.tag || github.ref_name }}"
        run: |
          # The Flatpak action also saves an unversioned copy of each bundle; only the versioned ones are published.
          rm -f out/MacNDroid-Linux-*.flatpak
          # CI screenshots are for checking layout, not for the release.
          rm -f out/*.png
          ls -la out
          gh release upload "$TAG" out/* --clobber --repo "${{ github.repository }}"
