# Publishes the site/ folder to GitHub Pages (https://design-n-build.github.io/mac-n-droid/).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "tools/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the What's new page from CHANGELOG.md
        run: python3 tools/site/build-whats-new.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
