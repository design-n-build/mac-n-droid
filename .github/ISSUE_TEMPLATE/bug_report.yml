name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Computer
      description: Mac n Droid version (Settings → About), and macOS, Windows or Linux version
      placeholder: "0.13.1 on macOS 26.1, MacBook Air M3 — or 0.13.1 on Windows 11 / Ubuntu 25.10"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      description: Mac n Droid version, phone model and Android version
      placeholder: "0.13.1 on a Pixel phone, Android 16"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (if you know them)
      placeholder: |
        1. Play a song in Spotify
        2. Switch to another app
        3. The notch goes blank
